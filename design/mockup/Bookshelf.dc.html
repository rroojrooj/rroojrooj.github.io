<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rooj Rinchokechai — Bookshelf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
a{color:#6E6B64}a:hover{color:#1C1B19}
</style>
</helmet>
<div style="background: #FBF9F3; color: #1C1B19; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; line-height: 1.6; padding: 64px 20px 72px; box-sizing: border-box">
<div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px">

<nav aria-label="Site" style="display: flex; gap: 22px; font-size: 15px; color: #6E6B64">
<a href="Main.dc.html" style="color: #6E6B64; text-decoration-line: underline; text-decoration-color: #BDB8AC; text-decoration-thickness: 1px; text-underline-offset: 3px">Home</a>
<a href="Photos.dc.html" style="color: #6E6B64; text-decoration-line: underline; text-decoration-color: #BDB8AC; text-decoration-thickness: 1px; text-underline-offset: 3px">Photos</a>
<span style="color: #1C1B19">Bookshelf</span>
</nav>

<header>
<h1 style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Bookshelf</h1>
</header>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; line-height: 1.3; font-weight: 400; color: #6E6B64">{{g.name}}</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{g.titles}}" as="t" hint-placeholder-count="6">
<li style="margin: 0">{{t}}</li>
</sc-for>
</ul>
</section>
</sc-for>

<footer style="padding-top: 18px; border-top: 1px solid #E5E1D6; font-size: 15px; color: #6E6B64">
<p style="margin: 0">Last updated 20 October 2026</p>
</footer>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { name: 'Investing', titles: [
          'The Intelligent Investor',
          'The Most Important Thing Illuminated',
          'University of Berkshire Hathaway',
          'Buffettology',
          'The Richest Man in Babylon'
        ] },
        { name: 'Business', titles: [
          'Zero to One',
          'The Lean Startup',
          'The Hard Thing About Hard Things',
          'Blitzscaling',
          'Trillion Dollar Coach',
          'Competitive Strategy',
          'Principles',
          'The Art of War'
        ] },
        { name: 'Biography & memoir', titles: [
          'Titan',
          'When Breath Becomes Air',
          'Tuesdays with Morrie'
        ] },
        { name: 'Psychology', titles: [
          "Man's Search for Meaning",
          'Outliers',
          'Talking to Strangers',
          'Men Are from Mars, Women Are from Venus'
        ] },
        { name: 'Fiction', titles: [
          'Pachinko',
          'The Kite Runner',
          'Norwegian Wood',
          'Men Without Women',
          'If Cats Disappeared from the World',
          'The Catcher in the Rye',
          'Lord of the Flies',
          'Of Mice and Men',
          'What We Talk About When We Talk About Love',
          'The Alchemist',
          'The Five People You Meet in Heaven'
        ] },
        { name: 'Thrillers', titles: [
          'Verity',
          'Origin'
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
