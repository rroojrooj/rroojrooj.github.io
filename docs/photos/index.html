<!--
  Adding a photo (see README.md):
  1. Put the full-size file at photos/<year>/<slug>.jpg (about 2000px on the long edge) and the
     thumbnail at photos/<year>/<slug>-800.jpg (about 800px). Strip all EXIF, including GPS.
  2. Photos come in sets: one race or one place, captioned once. Add a set inside that year's
     <div class="sets">, newest first (copy a year's <section> for a new year):
     <figure class="set" style="--span: 8">
     <a style="--s: 5" href="2026/slug.jpg"><img src="2026/slug-800.jpg" alt="What it shows" width="600" height="800" loading="lazy"></a>
     <a style="--s: 3" href="2026/other.jpg"><img src="2026/other-800.jpg" alt="..." width="800" height="533" loading="lazy"></a>
     <figcaption>Place</figcaption>
     </figure>
     The page is 12 columns wide. --span is how many the set takes; --s is how many each photo takes
     inside it (a row's --s values add up to the set's --span). Mix sizes rather than repeating one.
     class="lead" on a photo makes it full width on phones. Running sets say "Race, Year · time".
-->
