  Adding a photo (see README.md):
  1. Put the full-size file at photos/<year>/<slug>.jpg (about 2000px on the long edge) and the

  2. Add one line inside that year's gallery, newest first:
     <figure><a href="2026/slug.jpg"><img src="2026/slug-800.jpg" alt="What it shows" width="800" height="533" loading="lazy"></a><figcaption>Place, Month Year</figcaption></figure>
  3. Delete the placeholder figures once real ones are in.
-->
